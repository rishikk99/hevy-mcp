[project]
name = "hevy-mcp"
version = "0.1.0"
description = "Claude connector for Hevy: workout history, routines, and training plans over MCP."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.2.0",
    "mcp-types>=2.2.0",
    "httpx>=0.27",
    "playwright>=1.47",
    # zoneinfo's time zone rules; Windows ships none of its own.
    "tzdata>=2024.1",
]

[project.scripts]
hevy-mcp = "hevy_mcp.server:main"
hevy-mcp-authenticate = "hevy_mcp.cli:authenticate_main"
hevy-mcp-sync = "hevy_mcp.cli:sync_main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hevy_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
